# emaild -- production deployment.
#
#   mkdir -p /opt/emaild && cd /opt/emaild
#   curl -fsSL https://raw.githubusercontent.com/SoupNChill/internal_email_tool/main/deploy/compose.yaml -o compose.yaml
#   docker compose up -d
#
# That is the whole installation. There is no .env to write first and no
# installer to run: every secret this needs generates itself on first boot into
# a volume (emaild/secretstore.py). To upgrade, change the version on the
# x-image line below, then `docker compose pull && docker compose up -d`.
#
# This file differs from the repository root's docker-compose.yml in three ways
# that matter (§8):
#
#   1. No `build:`. Production must never compile on the destination server.
#   2. Images are pinned to an exact version, never `latest`.
#   3. EMAILD_ENV is hardcoded to production, not read from .env. A deployment
#      IS production by definition, and leaving it configurable is how an
#      unauthenticated dashboard ends up on a LAN by accident.
#
# Everything below can still be overridden from a .env file beside this one.
# The defaults exist so that not writing one is a supported choice rather than
# a shortcut you get away with.

name: emaild

# The version lives HERE, in the file you downloaded, rather than in a .env the
# operator has to create before anything will start. Pinning is preserved --
# this is an exact version and `latest` is still never used -- but the pin now
# travels with the artifact that needs it, which is also how you upgrade.
x-image: &image "${EMAILD_IMAGE:-ghcr.io/soupnchill/emaild}:${EMAILD_VERSION:-0.12.0-rc.1}"

services:
  postgres:
    image: postgres:17.2-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emaild}
      # A default, not a generated secret. Postgres publishes no port (see the
      # note below), so this password is only reachable from inside this
      # compose network -- anyone who can reach it already has the host.
      # Making the operator invent one was a mandatory install step that
      # protected nothing. Override POSTGRES_PASSWORD in .env if you disagree.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emaild}
      POSTGRES_DB: ${POSTGRES_DB:-emaild}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # §46: the database is never published, not even on the LAN. appctl reaches
    # it through `compose exec`, which needs no port at all.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-emaild} -d ${POSTGRES_DB:-emaild}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    image: *image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Only the DSN. Schema changes need no application secrets.
      EMAILD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-emaild}:${POSTGRES_PASSWORD:-emaild}@postgres:5432/${POSTGRES_DB:-emaild}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    image: *image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      EMAILD_ROLE: api
      EMAILD_ENV: production
      EMAILD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-emaild}:${POSTGRES_PASSWORD:-emaild}@postgres:5432/${POSTGRES_DB:-emaild}
      EMAILD_LOG_LEVEL: ${EMAILD_LOG_LEVEL:-INFO}
      EMAILD_TRUSTED_PROXY_HOSTS: ${EMAILD_TRUSTED_PROXY_HOSTS:-}
      EMAILD_DASHBOARD_ENABLED: ${EMAILD_DASHBOARD_ENABLED:-true}
      EMAILD_DASHBOARD_TOKEN: ${EMAILD_DASHBOARD_TOKEN:-}
      EMAILD_DASHBOARD_BEHIND_PROXY_AUTH: ${EMAILD_DASHBOARD_BEHIND_PROXY_AUTH:-false}
      # Generates a dashboard password on first boot when none was supplied.
      # That is what lets the production dashboard rule in config.py be
      # satisfied without the operator having to choose anything. Read it back
      # with `./appctl key`.
      EMAILD_SECRETS_DIR: /var/lib/emaild/secrets
      # Deliberately absent: MAILBOX_ENCRYPTION_KEY and MXROUTE_*.
    volumes:
      # api_secrets, NOT worker_secrets. The API cannot read the mailbox
      # encryption key because it does not mount the volume holding it -- a
      # stronger guarantee than the startup check in config.py, because it
      # holds even if that check is ever wrong.
      - api_secrets:/var/lib/emaild/secrets
    ports:
      # LAN-reachable by default: a transactional email API that only its own
      # host can call has no callers, and every product that needs it runs
      # somewhere else. On a home LAN this is the intended shape. It costs you
      # cleartext API keys on that network -- set EMAILD_BIND=127.0.0.1 if the
      # callers live on this same machine, or run the `public` profile for
      # HTTPS and a hostname reachable from beyond it.
      - "${EMAILD_BIND:-0.0.0.0}:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: *image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      EMAILD_ROLE: worker
      EMAILD_ENV: production
      EMAILD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-emaild}:${POSTGRES_PASSWORD:-emaild}@postgres:5432/${POSTGRES_DB:-emaild}
      EMAILD_LOG_LEVEL: ${EMAILD_LOG_LEVEL:-INFO}
      # No longer `:?`. Absent now means "generate one into the volume on first
      # boot", which is what removed the need for an installer. Supplying it
      # explicitly still wins, so an existing installation that already has a
      # key in .env keeps working untouched.
      EMAILD_MAILBOX_ENCRYPTION_KEY: ${EMAILD_MAILBOX_ENCRYPTION_KEY:-}
      EMAILD_SECRETS_DIR: /var/lib/emaild/secrets
      # Deliberately absent: MXROUTE_*.
    volumes:
      - worker_secrets:/var/lib/emaild/secrets
    # No ports. Outbound SMTP only.
    command: ["python", "-m", "emaild.worker"]
    stop_grace_period: 45s

  # Provisioning. Profile-gated so it NEVER starts on its own -- it exists to be
  # invoked as a one-off by `appctl admin`. This is the only container that
  # holds the MXRoute account-root credential, and it has no listener and no
  # published port, so it is never reachable from anywhere.
  admin:
    image: *image
    profiles: ["admin"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EMAILD_ROLE: admin
      EMAILD_ENV: production
      EMAILD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-emaild}:${POSTGRES_PASSWORD:-emaild}@postgres:5432/${POSTGRES_DB:-emaild}
      EMAILD_LOG_LEVEL: ${EMAILD_LOG_LEVEL:-WARNING}
      EMAILD_MAILBOX_ENCRYPTION_KEY: ${EMAILD_MAILBOX_ENCRYPTION_KEY:-}
      EMAILD_SECRETS_DIR: /var/lib/emaild/secrets
      EMAILD_MXROUTE_SERVER: ${EMAILD_MXROUTE_SERVER:-}
      EMAILD_MXROUTE_USERNAME: ${EMAILD_MXROUTE_USERNAME:-}
      EMAILD_MXROUTE_API_KEY: ${EMAILD_MXROUTE_API_KEY:-}
    volumes:
      # The SAME volume as the worker. Admin encrypts mailbox passwords that
      # the worker must later decrypt; two different keys here would produce
      # credentials that store cleanly and then fail to send, which is the
      # worst possible moment to discover the mistake.
      - worker_secrets:/var/lib/emaild/secrets
    entrypoint: ["python", "-m", "emaild.admin"]

  # Executes the domain jobs the dashboard queues. The ONLY long-running
  # process holding the MXRoute account-root credential.
  #
  # It exists so the dashboard can add and verify domains without holding that
  # credential itself. What bounds the risk is not this container being careful:
  # the API can only write a JobType, and that enum has two members, both about
  # domains and neither destructive. There is no way to express "delete a
  # mailbox", so a compromised API cannot ask for one.
  #
  # Note what is ABSENT: no ports, and no worker_secrets mount. Domain work
  # never decrypts a mailbox password, so this process cannot read one -- see
  # the note on role=admin in emaild/config.py.
  #
  # Starts by default, and idles harmlessly when MXROUTE_* is unset rather than
  # crash-looping or failing the queued work.
  provisioner:
    image: *image
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      EMAILD_ROLE: admin
      EMAILD_ENV: production
      EMAILD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-emaild}:${POSTGRES_PASSWORD:-emaild}@postgres:5432/${POSTGRES_DB:-emaild}
      EMAILD_LOG_LEVEL: ${EMAILD_LOG_LEVEL:-INFO}
      EMAILD_MXROUTE_SERVER: ${EMAILD_MXROUTE_SERVER:-}
      EMAILD_MXROUTE_USERNAME: ${EMAILD_MXROUTE_USERNAME:-}
      EMAILD_MXROUTE_API_KEY: ${EMAILD_MXROUTE_API_KEY:-}
      # Deliberately absent: MAILBOX_ENCRYPTION_KEY and EMAILD_SECRETS_DIR.
    command: ["python", "-m", "emaild.provisioner"]
    stop_grace_period: 30s

  # Opt-in. Gives HTTPS and a hostname reachable from outside the LAN --
  # necessary the day a product moves to a VPS, because it will not be able to
  # reach a LAN-only emaild and mail stops silently rather than erroring.
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    restart: unless-stopped
    profiles: ["public"]
    depends_on:
      - api
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: ["tunnel", "--no-autoupdate", "run"]
    # Route /v1/* straight through -- bearer keys authenticate machines.
    # Cloudflare Access goes on the dashboard routes ONLY: an API client cannot
    # complete an SSO challenge and would receive HTML where it expects JSON.

volumes:
  # Split by role on purpose: Docker decides which container can read which
  # secret, rather than the application promising not to look. See the comment
  # on the api service.
  api_secrets:
    driver: local

  worker_secrets:
    driver: local
    # Holds the mailbox encryption key. `appctl backup` deliberately does NOT
    # include this -- a leaked database archive must not also carry the key
    # that decrypts what is inside it. Save it separately: `./appctl key`.

  postgres_data:
    driver: local
    # NOT a backup (§14). Use `appctl backup`, and keep the archives on a
    # different machine than this one.
