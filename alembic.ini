[alembic]
script_location = alembic
prepend_sys_path = .
# Zero-padded numeric prefix keeps migrations ordered on disk exactly as they
# order in the database. release_rules §7: identifiers are permanent.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# sqlalchemy.url is intentionally absent -- env.py reads EMAILD_DATABASE_URL so
# credentials never live in a tracked file (release_rules §17).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
