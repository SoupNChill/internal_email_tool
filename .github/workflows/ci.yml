name: CI

# §30: pull-request workflows must not hold publishing credentials. This one is
# read-only and has no access to the registry -- publishing lives in release.yml
# behind a protected environment.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.2-bookworm
        env:
          POSTGRES_USER: emaild
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: emaild_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emaild -d emaild_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy emaild

      - name: Tests
        # conftest.py pins EMAILD_ENV_FILE=none before emaild is imported, so
        # no .env is needed and none can leak in.
        env:
          EMAILD_TEST_DATABASE_URL: postgresql+asyncpg://emaild:testpw@localhost:5432/emaild_test
        run: pytest -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan
        # A real script, not workflow-embedded logic: it is testable locally,
        # and it is what runs before every commit by hand.
        run: ./scripts/secret-scan.sh

  image:
    name: Build, start, health-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version from the single source
        id: version
        run: echo "value=$(grep -oP '__version__ = \"\K[^\"]+' emaild/__init__.py)" >> "$GITHUB_OUTPUT"

      - name: Build production image
        run: |
          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.value }}" \
            --build-arg GIT_COMMIT="$(git rev-parse --short HEAD)" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t emaild:ci .

      - name: No dev dependencies or installers in the runtime image
        run: |
          for module in pytest ruff mypy pip setuptools wheel; do
            if docker run --rm --entrypoint python emaild:ci -c "import $module" 2>/dev/null; then
              echo "::error::$module is present in the production image"
              exit 1
            fi
          done
          echo "runtime image is clean"

      - name: Runs as non-root
        run: |
          uid="$(docker run --rm --entrypoint id emaild:ci -u)"
          [ "$uid" != "0" ] || { echo "::error::image runs as root"; exit 1; }
          echo "runs as uid $uid"

      - name: No secrets baked into the image
        run: |
          if docker run --rm --entrypoint sh emaild:ci -c '[ -f /app/.env ]'; then
            echo "::error::.env is present inside the image"
            exit 1
          fi
          echo "no .env in image"

      # §24: the container must actually start and become healthy, not merely
      # build. A build that produces an image which cannot serve is a green
      # check mark that means nothing.
      - name: Start the stack and wait for health
        run: |
          docker network create ci-net
          docker run -d --name pg --network ci-net \
            -e POSTGRES_USER=emaild -e POSTGRES_PASSWORD=testpw -e POSTGRES_DB=emaild \
            postgres:17.2-bookworm
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -U emaild -d emaild >/dev/null 2>&1 && break
            sleep 2
          done

          docker run --rm --network ci-net \
            -e EMAILD_DATABASE_URL=postgresql+asyncpg://emaild:testpw@pg:5432/emaild \
            emaild:ci alembic upgrade head

          docker run -d --name api --network ci-net -p 8000:8000 \
            -e EMAILD_ROLE=api \
            -e EMAILD_DATABASE_URL=postgresql+asyncpg://emaild:testpw@pg:5432/emaild \
            emaild:ci

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready 2>/dev/null | grep -q '"status":"ready"'; then
              ready=1; break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::api never became ready"
            docker logs api
            exit 1
          fi
          echo "health: $(curl -s http://127.0.0.1:8000/health/ready)"
          echo "version: $(curl -s http://127.0.0.1:8000/version)"

      - name: Version endpoint matches the source
        run: |
          reported="$(curl -s http://127.0.0.1:8000/version | grep -oP '"version":"\K[^"]+')"
          [ "$reported" = "${{ steps.version.outputs.value }}" ] \
            || { echo "::error::/version says $reported, source says ${{ steps.version.outputs.value }}"; exit 1; }
          echo "version agrees: $reported"

      - name: Installation identity was generated
        run: |
          id="$(docker exec pg psql -U emaild -d emaild -tAc 'SELECT installation_id FROM installation' | tr -d ' \r')"
          [ -n "$id" ] || { echo "::error::no installation identity was created"; exit 1; }
          echo "installation: $id"

      - name: Teardown
        if: always()
        run: docker rm -f api pg 2>/dev/null || true

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax
        run: |
          bash -n deploy/appctl
          bash -n scripts/secret-scan.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning deploy/appctl scripts/secret-scan.sh

  compose:
    name: Production compose is deployable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No build directives (§8 — production must not compile on the host)
        run: |
          if grep -E '^\s+build:' deploy/compose.yaml; then
            echo "::error::deploy/compose.yaml contains a build directive"
            exit 1
          fi
          echo "no build directives"

      # This replaced a check that compose REFUSED to start without an explicit
      # EMAILD_VERSION. That requirement was what forced an installer to exist,
      # and it has been removed deliberately. The rule it was protecting -- §8,
      # never deploy a moving tag -- has not changed, so it is asserted against
      # the default itself rather than against the absence of one.
      - name: The default version is an exact pin, not a moving tag
        run: |
          default="$(grep -oP 'EMAILD_VERSION:-\K[^}]+' deploy/compose.yaml)"
          if [ -z "$default" ]; then
            echo "::error::deploy/compose.yaml has no default EMAILD_VERSION"
            exit 1
          fi
          case "$default" in
            latest|stable|main|dev|edge|release)
              echo "::error::default version '$default' is a moving tag (§8)"
              exit 1 ;;
          esac
          echo "default version is '$default'"

      # The headline property of the install: three commands, no configuration.
      # If this ever fails, someone has reintroduced a mandatory variable and
      # the documented install is broken.
      - name: Validates with NO environment variables at all
        run: |
          env -u EMAILD_VERSION -u POSTGRES_PASSWORD -u EMAILD_MAILBOX_ENCRYPTION_KEY \
            docker compose -f deploy/compose.yaml config --quiet
          echo "zero-configuration compose is valid"

      - name: The API never mounts the worker's secrets volume
        run: |
          python3 - <<'EOF'
          import sys
          text = open("deploy/compose.yaml").read()
          api = text.split("  api:", 1)[1].split("\n  worker:", 1)[0]
          # Comments in this block legitimately mention worker_secrets to
          # explain why it is absent, so match declarations only.
          mounts = [
              ln.strip() for ln in api.splitlines()
              if ln.strip().startswith("- ") and "_secrets:" in ln
          ]
          if any("worker_secrets" in m for m in mounts):
              print("::error::the api service mounts worker_secrets -- it could read the mailbox encryption key")
              sys.exit(1)
          if not any("api_secrets" in m for m in mounts):
              print("::error::the api service has no secrets volume; the dashboard token cannot generate")
              sys.exit(1)
          print("api mounts only:", ", ".join(mounts))
          EOF

      - name: Database publishes no port
        run: |
          python3 - <<'EOF'
          import sys
          text = open("deploy/compose.yaml").read()
          block = text.split("postgres:", 1)[1].split("migrate:", 1)[0]
          if "ports:" in block:
              print("::error::postgres publishes a host port in production")
              sys.exit(1)
          print("postgres is internal only")
          EOF
